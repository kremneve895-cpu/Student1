services:
  web:
    build: .
    ports:
      # ВПИШИТЕ порт приложения (см. app.run в app.py): "ПОРТ:ПОРТ"
      - "____"
    depends_on:
      - db

  db:
    # ВПИШИТЕ образ PostgreSQL версии 13:
    image: ____
    environment:
      POSTGRES_PASSWORD: ____   # ВПИШИТЕ пароль (как в app.py)
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
